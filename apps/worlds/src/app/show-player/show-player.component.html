<galaxy-navigation-component></galaxy-navigation-component>
<h2>Show Player</h2>
<h4>Spieler-Liste</h4>

<ol>
  @for (player of players$| async; track player) {
    <li>{{ player }}</li>
  }
</ol>
<button class="btn btn-default" (click)="showHideColorPicker()">Select color </button>
<div class="color-picker" [hidden]="isPickerShown">
  @for (color of colors$| async; track color) {
    <div [ngStyle]="{'background-color': color}" (click)="pickColor(color)">
    </div>
  }
</div>
